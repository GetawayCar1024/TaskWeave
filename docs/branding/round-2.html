<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>CaseWeave · Round two archive</title>
  <style>
    :root { color-scheme:light; --ink:#202d43; --muted:#65738b; --line:#e0e6f0; --accent:#4459d7; --focus:#f0f3ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f7f9fd; color:var(--ink); font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible,a:focus-visible { outline:3px solid #8091ed; outline-offset:4px; }
    .page { max-width:1320px; margin:0 auto; padding:34px 38px 24px; }
    header { display:flex; justify-content:space-between; gap:32px; align-items:end; padding-bottom:23px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 6px; font:600 38px/1.12 Bahnschrift,"Segoe UI",sans-serif; letter-spacing:-.03em; }
    header p { margin:0; color:var(--muted); max-width:64ch; }
    .revision { color:var(--muted); font-size:12px; text-align:right; }
    .revision a { color:var(--muted); text-underline-offset:3px; }
    .layout { display:grid; grid-template-columns:246px minmax(0,1fr); gap:34px; padding-top:25px; }
    aside { min-width:0; }
    h2 { margin:0; font-size:15px; font-weight:650; }
    .aside-intro { color:var(--muted); margin:4px 0 13px; font-size:12px; }
    #name-options { display:grid; gap:3px; }
    #name-options button { border:1px solid transparent; background:transparent; text-align:left; padding:11px 13px; border-radius:7px; color:var(--ink); }
    #name-options button:hover { background:white; }
    #name-options button[aria-pressed=true] { border-color:#cad3f7; background:#edf1ff; }
    #name-options span { display:block; font:550 19px/1.3 Bahnschrift,"Segoe UI",sans-serif; letter-spacing:-.02em; }
    #name-options small { display:block; color:var(--muted); margin-top:3px; font-size:11px; }
    .name-note { margin:18px 0 21px; padding-left:14px; border-left:3px solid #ccd6f8; font-size:12px; color:var(--muted); }
    #chosen-name { display:block; font:600 19px/1.4 Bahnschrift,"Segoe UI",sans-serif; color:var(--ink); margin-bottom:5px; }
    .sidebar-preview { margin-top:24px; padding-top:18px; border-top:1px solid var(--line); }
    .sidebar-preview h2 { font-size:12px; color:var(--muted); font-weight:500; }
    #app-preview { display:flex; gap:10px; align-items:center; margin-top:12px; }
    #app-preview svg { flex-shrink:0; }
    #app-preview strong { display:block; font-size:14px; font-weight:600; }
    #app-preview span { display:block; font-size:11px; color:var(--muted); }
    .gallery-head { display:flex; gap:12px; justify-content:space-between; align-items:center; min-height:40px; margin-bottom:14px; }
    #palettes { display:flex; gap:5px; flex-wrap:wrap; }
    #palettes button { display:flex; align-items:center; gap:7px; border:1px solid var(--line); padding:5px 9px; background:white; border-radius:20px; font-size:11px; color:var(--muted); }
    #palettes button[aria-pressed=true] { border-color:#acb9ed; color:var(--accent); background:var(--focus); }
    #palettes i { width:10px; height:10px; border-radius:50%; }
    #marks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px 20px; }
    .mark { padding:16px 16px 0; background:white; border:1px solid var(--line); min-width:0; border-radius:9px; }
    .mark.selected { border-color:#9eafea; box-shadow:0 0 0 1px #d9e1fb; }
    .mark-art { border:0; width:100%; min-height:151px; background:none; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:0; position:relative; }
    .mark-art svg { display:block; }
    .mark-art > span { position:absolute; bottom:0; opacity:0; color:var(--muted); font-size:10px; }
    .mark-art:hover > span,.mark-art:focus-visible > span { opacity:1; }
    .mark-title { display:flex; gap:6px; align-items:center; justify-content:space-between; margin-top:8px; }
    h3 { display:flex; align-items:baseline; gap:8px; margin:0; font:600 16px/1.3 Bahnschrift,"Segoe UI",sans-serif; }
    h3 > span { color:#8693ae; font:500 12px/1 "Segoe UI",sans-serif; }
    .recommendation { color:#596cab; font-size:10px; white-space:nowrap; }
    .mark p { margin:5px 0 12px; color:var(--muted); font-size:11px; }
    .small-previews { display:flex; align-items:center; gap:10px; min-height:42px; }
    .small-previews > svg { flex-shrink:0; }
    .mono-preview { display:grid; place-items:center; width:40px; height:40px; margin-left:auto; }
    .dark-preview { display:grid; place-items:center; width:42px; height:42px; background:#263143; border-radius:7px; }
    .mark-actions { display:flex; justify-content:space-between; margin-top:13px; padding:8px 0; border-top:1px solid #edf0f6; }
    .mark-actions button { border:0; background:none; color:var(--muted); padding:3px 0; font-size:11px; }
    .mark-actions .choose { color:var(--accent); }
    .gallery-note { color:var(--muted); font-size:11px; margin:11px 0 0; }
    footer { display:flex; gap:18px; justify-content:space-between; align-items:center; padding-top:20px; margin-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
    footer strong { color:var(--ink); font-weight:600; }
    dialog { width:min(550px,92vw); border:1px solid var(--line); padding:32px; border-radius:16px; color:var(--ink); }
    dialog::backdrop { background:rgba(20,30,53,.45); }
    #close-zoom { position:absolute; right:14px; top:10px; border:0; background:none; color:var(--muted); font-size:26px; padding:3px 8px; }
    .zoom-art { display:flex; justify-content:center; padding:12px 0 24px; }
    dialog h2 { font:600 27px/1.3 Bahnschrift,"Segoe UI",sans-serif; }
    .zoom-caption { color:var(--muted); margin-bottom:0; }
    @media(min-width:1500px) { .page { max-width:1420px; } .mark-art { min-height:173px; } }
    @media(max-width:1050px) { .page { padding:24px; } .layout { grid-template-columns:208px minmax(0,1fr); gap:22px; } #marks { grid-template-columns:repeat(2,minmax(0,1fr)); } .gallery-head { align-items:start; flex-direction:column; } }
    @media(max-width:680px) { header { align-items:start; } h1 { font-size:30px; } .revision { display:none; } .layout { grid-template-columns:1fr; } #name-options { grid-template-columns:repeat(2,minmax(0,1fr)); } .sidebar-preview { display:none; } .name-note { margin-bottom:0; } #marks { gap:12px; } .mark { padding:12px 11px 0; } .mark-art svg { width:104px; height:104px; } .mark-art { min-height:118px; } .small-previews { gap:6px; } .small-previews > svg:nth-child(2) { display:none; } h3 { font-size:14px; } .recommendation { display:none; } footer { align-items:start; flex-direction:column; } }
  </style>
</head>
<body>
  <main class="page">
    <header><div><h1>CaseWeave, explored.</h1><p>六个英文名字，六种新的图标方向。名字和图形可分别选择。</p></div><div class="revision">第二轮品牌草案<br><a href="round-1.html">第一轮归档</a></div></header>
    <div class="layout">
      <aside>
        <h2>英文名字</h2><p class="aside-intro">点击名字，看它和图标搭配的感觉。</p>
        <div id="name-options"></div>
        <div class="name-note"><strong id="chosen-name">CaseWeave</strong><div id="chosen-caption"></div></div>
        <div class="sidebar-preview"><h2>应用列表中的感觉</h2><div id="app-preview"></div></div>
      </aside>
      <section aria-label="图标方案">
        <div class="gallery-head"><h2>图标方向</h2><div id="palettes" aria-label="图标配色"></div></div>
        <div id="marks"></div>
        <p class="gallery-note">每款均包含 16 / 24 / 40 px、去底色标识与深色背景预览。点大图可放大，SVG 可直接下载。</p>
      </section>
    </div>
    <footer><div>当前搭配：<strong id="selection-text"></strong></div><div>可以直接说「CaseWeave + E」，或只选一个方向继续改。</div></footer>
  </main>
  <dialog id="zoom"><button id="close-zoom" aria-label="关闭放大预览">×</button><div class="zoom-art"></div><h2></h2><p class="zoom-caption"></p></dialog>
  <script src="round-2/marks.js?v=2"></script>
  <script src="round-2/preview.js?v=2"></script>
</body>
</html>
