name: Linux preview

on:
  push:
    branches: [linux-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Native Linux runner contract
        run: pnpm --filter @polyforge/server exec tsx --test --test-concurrency=1 scripts/test-linux-runner.ts
