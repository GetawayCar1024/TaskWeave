# DefSubsequence

[[english.command]]
name = "DefSubsequence"
args = ["a", "b"]
body = '
A sequence $#1$ is a subsequence of a sequence $#2$ if $#1$ can be obtained from $#2$ by the deletion of several (possibly, zero or all) elements from arbitrary positions.
'

[[russian.command]]
name = "DefSubsequence"
args = ["a", "b"]
body = '
Последовательность $#1$ является подпоследовательностью $#2$, если $#1$ может быть получена из $#2$ удалением нескольких (возможно, ни одного или всех) элементов на произвольных позициях.
'

[[chinese.command]]
name = "DefSubsequence"
args = ["a", "b"]
body = '''
若序列 $#1$ 可以由序列 $#2$ 删去任意位置上的若干个（可能为零个或全部）元素得到，则称 $#1$ 是 $#2$ 的子序列。
'''

