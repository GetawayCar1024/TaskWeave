# OI statement phrases / OI 题面常用术语
# Automatically loaded alongside shared/defs.toml. Existing files are never overwritten.
# 中文题面使用 chinese，英文题面使用 english。前缀 OI 避免与 CF 宏重名。
# 非空 args 是可选参数的默认值，用方括号传参；空字符串表示必填参数，用花括号传参。
# 示例：\OIInputFile[trip.in]  \OIOutputFile[trip.out]
#       \OIConstraints{1 \le n \le 10^5}  \OISubtask[1][30]{n \le 100}
# 数学参数内不要重复写 $；文件名用 \t 渲染。

[[chinese.command]]
name = "OIInputFile"
args = ["problem.in"]
body = '''
从文件 \t{#1} 中读入数据。
'''

[[english.command]]
name = "OIInputFile"
args = ["problem.in"]
body = '''
Read the input from \t{#1}.
'''

[[chinese.command]]
name = "OIOutputFile"
args = ["problem.out"]
body = '''
将答案输出到文件 \t{#1} 中。
'''

[[english.command]]
name = "OIOutputFile"
args = ["problem.out"]
body = '''
Write the output to \t{#1}.
'''

[[chinese.command]]
name = "OIStandardInput"
args = []
body = '''
从标准输入读入数据。
'''

[[english.command]]
name = "OIStandardInput"
args = []
body = '''
Read the input from standard input.
'''

[[chinese.command]]
name = "OIStandardOutput"
args = []
body = '''
将答案输出到标准输出。
'''

[[english.command]]
name = "OIStandardOutput"
args = []
body = '''
Write the output to standard output.
'''

[[chinese.command]]
name = "OIConstraints"
args = [""]
body = '''
对于所有测试数据，保证 $#1$。
'''

[[english.command]]
name = "OIConstraints"
args = [""]
body = '''
For all test cases, it is guaranteed that $#1$.
'''

[[chinese.command]]
name = "OIPartialConstraints"
args = ["30", ""]
body = '''
对于 $#1\%$ 的测试数据，保证 $#2$。
'''

[[english.command]]
name = "OIPartialConstraints"
args = ["30", ""]
body = '''
For $#1\%$ of the test cases, it is guaranteed that $#2$.
'''

[[chinese.command]]
name = "OISubtask"
args = ["1", "30", ""]
body = '''
子任务 $#1$（$#2$ 分）：保证 $#3$。
'''

[[english.command]]
name = "OISubtask"
args = ["1", "30", ""]
body = '''
Subtask $#1$ ($#2$ points): it is guaranteed that $#3$.
'''

[[chinese.command]]
name = "OIBundledScoring"
args = []
body = '''
本题采用子任务捆绑测试。只有通过一个子任务中的全部测试点，才能获得该子任务的分数。
'''

[[english.command]]
name = "OIBundledScoring"
args = []
body = '''
This problem uses subtask scoring. A subtask scores points only if all of its test cases are passed.
'''

[[chinese.command]]
name = "OISubtaskDependency"
args = ["2", "1"]
body = '''
子任务 $#1$ 依赖于子任务 $#2$；只有通过被依赖子任务中的全部测试点，才能获得子任务 $#1$ 的分数。
'''

[[english.command]]
name = "OISubtaskDependency"
args = ["2", "1"]
body = '''
Subtask $#1$ depends on subtask $#2$; points for subtask $#1$ can be earned only after all test cases in subtask $#2$ are passed.
'''

[[chinese.command]]
name = "OILargeSample"
args = ["2", "trip"]
body = '''
样例 $#1$ 见选手目录下的 \t{#2/#2#1.in} 与 \t{#2/#2#1.out}。
'''

[[english.command]]
name = "OILargeSample"
args = ["2", "trip"]
body = '''
Sample $#1$: see \t{#2/#2#1.in} and \t{#2/#2#1.out} in the contestant directory.
'''

[[chinese.command]]
name = "OIIntegerOutput"
args = []
body = '''
输出一行一个整数，表示答案。
'''

[[english.command]]
name = "OIIntegerOutput"
args = []
body = '''
Print one integer on a single line: the answer.
'''

[[chinese.command]]
name = "OIGraderInterface"
args = ["", "grader.h"]
body = '''
你需要实现函数 \t{#1}，并包含头文件 \t{#2}。请勿定义 \t{main} 函数；你的程序将与评测程序一同编译。
'''

[[english.command]]
name = "OIGraderInterface"
args = ["", "grader.h"]
body = '''
Implement the function \t{#1} and include the header \t{#2}. Do not define \t{main}; your submission will be compiled together with the grader.
'''
